name: Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile "海拓表格.py"
      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name HaituoTable "海拓表格.py"
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Package installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: HaituoTable-Windows-Installer
          path: HaituoTable_Setup_v0.1.0_Win64.exe
          if-no-files-found: error
