name: Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile haituo_qt.py
      - name: Smoke test core UI\n        env:\n          QT_QPA_PLATFORM: offscreen\n        run: python test_smoke.py\n      - name: Build standalone Qt EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name HaituoTable haituo_qt.py
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Package installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: HaituoTable-v1.3-Windows-Installer
          path: HaituoTable_Setup_v1.3.0_Win64.exe
          if-no-files-found: error
