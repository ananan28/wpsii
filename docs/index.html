<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海拓表格 在线编辑</title>
<style>body{margin:0;background:#f2f6f3;color:#173b2b;font:14px "Microsoft YaHei",Arial}.head{background:#164b37;color:white;display:flex;gap:18px;align-items:center;padding:14px 24px}.brand{font-size:21px;font-weight:bold}.spacer{flex:1}.head button{background:#317558;color:white;border:1px solid #5a9477}.shell{padding:20px}.ribbon{background:white;border:1px solid #dae8df;border-radius:12px;box-shadow:0 5px 20px #164b3712}.tabs{border-bottom:1px solid #dae8df;padding:10px 15px;font-weight:bold}.tools{padding:13px;display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #d1ded5;border-radius:7px;padding:9px 13px;background:#fff;cursor:pointer}button:hover{background:#e2f3e8}.paper{background:white;margin-top:15px;border:1px solid #dae8df;border-radius:10px;overflow:hidden}.formula{padding:10px;display:flex;gap:10px}.formula input{border:1px solid #cadace;padding:8px;border-radius:6px}.formula #address{width:75px}.formula #value{flex:1}.viewport{height:65vh;overflow:auto}table{border-collapse:separate;border-spacing:0}td,th{border-right:1px solid #e1e8e3;border-bottom:1px solid #e1e8e3;height:29px;min-width:115px;max-width:115px;padding:3px 7px;white-space:nowrap;overflow:hidden}th{position:sticky;top:0;background:#edf3ee;z-index:2;text-align:center}th.row{position:sticky;left:0;min-width:40px;max-width:40px;z-index:3}td:focus{outline:2px solid #178c55;outline-offset:-2px;background:#eefbf1}.foot{display:flex;justify-content:space-between;padding:12px 18px;color:#667f70}</style>
<div class="head"><span class="brand">▦ 海拓表格</span><span>在线编辑预览版</span><span class="spacer"></span><span id="status">本浏览器自动保存</span><button onclick="exportCSV()">导出 CSV</button></div>
<div class="shell"><div class="ribbon"><div class="tabs">开始　　插入　　数据　　视图</div><div class="tools"><button onclick="document.getElementById('upload').click()">打开 CSV</button><button onclick="exportCSV()">保存为 CSV</button><button onclick="sortRows(1)">升序 A→Z</button><button onclick="sortRows(-1)">降序 Z→A</button><button onclick="dedupe()">按列去重</button><button onclick="filterRows()">筛选</button><button onclick="clearFilter()">清除筛选</button><button onclick="clearAll()">新建表格</button></div></div>
<div class="paper"><div class="formula"><input id="address" value="A1" readonly><input id="value" placeholder="输入单元格内容，按回车保存"></div><div class="viewport"><table id="grid"></table></div><div class="foot"><span>工作表1</span><span>数据自动保存到当前浏览器；未启用云端同步 · 最大 100 行 / 20 列</span></div></div></div><input type="file" id="upload" hidden accept=".csv,.tsv,.txt">
<script>
const R=100,C=20,K="haituo_online_demo_v1";let data=Array.from({length:R},()=>Array(C).fill("")),selected=[0,0],timer;
try{const saved=JSON.parse(localStorage.getItem(K));if(Array.isArray(saved)&&saved.length===R)data=saved}catch(e){}
const col=c=>String.fromCharCode(65+c);
function autosave(){clearTimeout(timer);document.getElementById("status").textContent="正在保存";timer=setTimeout(()=>{try{localStorage.setItem(K,JSON.stringify(data));document.getElementById("status").textContent="已保存到本机浏览器"}catch(e){document.getElementById("status").textContent="保存失败：浏览器存储已满"}},300)}
function choose(r,c){selected=[r,c];document.getElementById("address").value=col(c)+(r+1);document.getElementById("value").value=data[r][c]}
function render(){const t=document.getElementById("grid");t.replaceChildren();const header=document.createElement("tr"),corner=document.createElement("th");corner.className="row";header.append(corner);for(let c=0;c<C;c++){const th=document.createElement("th");th.textContent=col(c);header.append(th)}t.append(header);for(let r=0;r<R;r++){const tr=document.createElement("tr"),rh=document.createElement("th");rh.className="row";rh.textContent=r+1;tr.append(rh);for(let c=0;c<C;c++){const td=document.createElement("td");td.contentEditable="true";td.textContent=data[r][c];td.onfocus=()=>choose(r,c);td.oninput=()=>{data[r][c]=td.textContent;choose(r,c);autosave()};tr.append(td)}t.append(tr)}}
document.getElementById("value").onchange=e=>{const[r,c]=selected;data[r][c]=e.target.value;render();autosave()};
function sortRows(dir){const c=selected[1];const filled=data.filter(row=>row.some(v=>v));filled.sort((a,b)=>dir*String(a[c]).localeCompare(String(b[c]),"zh-CN",{numeric:true}));data=[...filled,...Array.from({length:R-filled.length},()=>Array(C).fill(""))];render();autosave()}
function dedupe(){const c=selected[1],seen=new Set();let removed=0;const result=data.filter(row=>{let v=row[c].trim().toLowerCase();if(!v)return true;if(seen.has(v)){removed++;return false}seen.add(v);return true});data=[...result,...Array.from({length:removed},()=>Array(C).fill(""))];render();autosave();alert("去重完成，删除 "+removed+" 行")}
function filterRows(){const q=prompt("筛选 "+col(selected[1])+" 列包含的文字");if(q===null)return;document.querySelectorAll("#grid tr").forEach((tr,i)=>{if(i)tr.hidden=!data[i-1][selected[1]].toLowerCase().includes(q.toLowerCase())})}
function clearFilter(){document.querySelectorAll("#grid tr").forEach(tr=>tr.hidden=false)}
function clearAll(){if(!confirm("清空所有内容并新建？"))return;data=Array.from({length:R},()=>Array(C).fill(""));render();autosave()}
function csvEncode(s){s=String(s);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCSV(){let last=data.length;while(last&&!data[last-1].some(v=>v))last--;const csv="\ufeff"+data.slice(0,last).map(r=>r.map(csvEncode).join(",")).join("\r\n"),a=document.createElement("a"),url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.href=url;a.download="海拓表格.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function parseCSV(s){let out=[],row=[],cell="",q=false;for(let i=0;i<s.length;i++){let ch=s[i];if(ch==='"'){if(q&&s[i+1]==='"'){cell+='"';i++}else q=!q}else if(ch===","&&!q){row.push(cell);cell=""}else if((ch==="\n"||ch==="\r")&&!q){if(ch==="\r"&&s[i+1]==="\n")i++;row.push(cell);out.push(row);row=[];cell=""}else cell+=ch}if(cell||row.length){row.push(cell);out.push(row)}return out}
document.getElementById("upload").onchange=async e=>{const f=e.target.files[0];if(!f)return;let text=await f.text(),rows=f.name.endsWith(".tsv")?text.split(/\r?\n/).map(x=>x.split("\t")):parseCSV(text.replace(/^\ufeff/,""));if(rows.length>R||rows.some(r=>r.length>C)){alert("预览版最多支持 100 行、20 列");return}data=Array.from({length:R},(_,i)=>Array.from({length:C},(_,j)=>rows[i]?.[j]??""));render();autosave();e.target.value=""};render()
</script></html>
